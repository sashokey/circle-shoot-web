<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111b19">
<title>Zuma Deluxe — WebAssembly</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="player">
<div class="toolbar"><span>Zuma Deluxe</span><div><button id="swap" disabled>Swap</button><button id="pause" disabled>Pause</button><button id="mute">Mute</button><button id="fullscreen">Fullscreen</button></div></div>
<div id="stage">
<canvas id="game" width="1280" height="960" tabindex="0" aria-label="Zuma Deluxe game board"></canvas>
<section id="loading" class="panel"><h1>Zuma Deluxe</h1><p id="load-message">Loading…</p><progress id="progress"></progress></section>
<div id="native-controls" aria-label="Game controls"></div>
</div>
<p id="status" aria-live="polite">Loading game data…</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
